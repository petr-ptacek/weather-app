name: Trigger deploy

# Deploy vsech variant bezi z vetve main (.github/workflows/deploy.yml).
# Tento workflow ho jen spusti po pushi do teto vetve.

on:
  push:
    branches: [ vue, react ]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
